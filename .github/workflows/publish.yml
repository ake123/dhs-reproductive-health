name: Publish R Quarto Report

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::survey
            any::srvyr
            any::scales
            any::broom

      - name: Verify R environment
        run: |
          Rscript -e 'print(R.version.string)'
          Rscript -e 'print(.libPaths())'
          Rscript -e 'packageVersion("knitr")'
          Rscript -e 'packageVersion("rmarkdown")'
          Rscript -e 'packageVersion("survey")'
          Rscript -e 'packageVersion("srvyr")'

      - name: Render Quarto website
        run: quarto render

      - name: Publish to gh-pages
        run: quarto publish gh-pages --no-render --no-browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
